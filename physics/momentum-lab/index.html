<style>

*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button,select,input[type=range]{cursor:pointer}button{border:1px solid var(--line);background:white;color:var(--ink);padding:10px 16px;border-radius:9px;font-weight:600}button:hover{background:#edf3f3}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #cf702c;outline-offset:3px}button.primary{background:var(--navy);color:white;border-color:var(--navy)}button:disabled{opacity:.5;cursor:not-allowed}a{color:var(--teal)}[hidden]{display:none!important}.top{background:var(--navy);color:white;padding:24px max(24px,calc((100vw - 1440px)/2)) 22px}.topline{display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;gap:14px;align-items:center}.mark{font:700 25px Georgia,serif;width:48px;height:48px;border:1px solid #72939e;border-radius:14px;display:grid;place-items:center;color:#bce6df}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2px;font-weight:700;color:#bdd4db}h1{font-size:29px;line-height:1.2;margin:3px 0}h2{font-size:21px;margin:0}h3{font-size:16px;margin:0 0 12px}p{margin:7px 0}.tagline{color:#d5e2e6;margin:12px 0 0;max-width:850px}.top button{background:transparent;color:white;border-color:#63808b}.top button:hover{background:#244e60}.shell{max-width:1440px;margin:auto;padding:20px 24px 36px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px}.tabs button{background:transparent;border-color:transparent;padding:11px 18px}.tabs button[aria-selected=true]{background:white;border-color:var(--line);box-shadow:0 2px 4px #153b4b08}.tabs .num{font-size:12px;margin-right:9px;color:var(--teal)}.layout{display:grid;grid-template-columns:278px minmax(0,1fr);gap:20px;align-items:start}.panel{background:white;border:1px solid var(--line);border-radius:14px}.controls{padding:21px}.subtle{color:var(--muted);font-size:13px}.control{margin:20px 0}.control-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px}.control label{font-size:13px;font-weight:600}.entry{display:flex;align-items:center;gap:5px;white-space:nowrap}.entry input{width:72px;padding:4px 5px;border:1px solid var(--line);border-radius:5px;text-align:right;font-variant-numeric:tabular-nums}.unit{color:var(--muted);font-size:12px}.control input[type=range]{display:block;width:100%;accent-color:var(--teal)}select{max-width:100%;width:100%;padding:9px;border:1px solid var(--line);border-radius:7px;background:white;color:var(--ink)}.rule{height:1px;background:var(--line);margin:18px 0}.controls .note{font-size:12px;color:var(--muted)}.controls .formula{font-family:Georgia,serif;font-size:17px;line-height:1.8;background:var(--soft);padding:12px;border-radius:8px}.main{min-width:0}.lab-head{display:flex;justify-content:space-between;gap:12px;align-items:start;margin-bottom:15px}.pill{border-radius:20px;background:var(--soft);color:#20584f;padding:5px 11px;font-size:12px;font-weight:600;white-space:nowrap}.prompt{padding:12px 16px;border-left:3px solid var(--orange);background:#fff5eb;border-radius:0 7px 7px 0;margin-bottom:16px;font-size:14px}.prompt strong{color:#8e451b}.scene-wrap{padding:16px 18px 12px}.scene-label{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--muted)}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px}.swatch{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.a{background:var(--teal)}.b{background:var(--orange)}.scene{width:100%;height:258px;display:block}.transport{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:12px;border-top:1px solid var(--line)}.transport .speed{width:auto;padding:9px 5px}.transport .clock{margin-left:auto;font-variant-numeric:tabular-nums;font-size:13px}.scrub{display:flex;gap:10px;align-items:center;margin-top:12px}.scrub input{width:100%;accent-color:var(--teal)}.scrub label{font-size:12px;white-space:nowrap}.status{min-height:26px;font-size:13px;color:var(--muted);margin-top:9px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:15px 0}.stat{padding:14px 16px}.stat label{display:block;font-size:12px;color:var(--muted)}.stat strong{display:block;font-size:22px;font-weight:650;margin:4px 0;font-variant-numeric:tabular-nums}.stat small{display:block;font-size:12px;color:var(--muted)}.graphs{display:grid;grid-template-columns:1fr 1fr;gap:14px}.graph{padding:15px 10px 5px;min-width:0}.graph h3{font-size:14px;padding:0 5px;margin-bottom:3px}.plot{height:213px;display:block;width:100%;overflow:visible}.chartlegend{padding-left:5px;min-height:20px}.ledger{margin-top:15px;padding:18px}.ledgerhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.ledgerhead h3{margin:0}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}th,td{padding:9px 7px;border-bottom:1px solid #e7ecee;text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{font-size:12px;color:var(--muted);font-weight:500}td.total{font-weight:700}.details{margin-top:16px;padding:16px 18px}.details summary{cursor:pointer;font-weight:600}.details p,.details li{font-size:13px;color:var(--muted)}.details code{color:var(--ink);font-size:13px}.details ul{padding-left:19px}.error{background:#fff0ed;color:var(--red);padding:12px;border-radius:8px;margin-bottom:12px}.guide{padding:24px;margin-bottom:20px}.guide-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.guide ol,.guide ul{padding-left:20px}.guide p,.guide li{font-size:14px}.guide .closing{border-top:1px solid var(--line);padding-top:12px;margin-top:16px}.footer{margin-top:24px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.empty{color:var(--muted)}
@media(min-width:1100px){.controls{position:sticky;top:15px}}

@media(max-width:700px){.shell{padding:16px 12px}.top{padding:20px 16px}.layout{grid-template-columns:1fr}.controls{padding:16px}.control-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.control{margin:12px 0}.topline{align-items:start}.top button{font-size:12px;padding:9px}.mark{display:none}.tagline{font-size:13px}h1{font-size:25px}.tabs{gap:3px}.tabs button{padding:9px 10px;font-size:13px}.stats{gap:7px}.stat{padding:10px}.stat strong{font-size:18px}.stat small{font-size:11px}.lab-head{flex-wrap:wrap}.scene-wrap{padding:12px}.guide-grid{grid-template-columns:1fr}.ledger{padding:12px}.ledgerhead{flex-wrap:wrap}}

.top{padding:18px max(20px,calc((100vw - 1200px)/2))}.eyebrow{font-size:10px}h1{font-size:25px}.shell{max-width:1248px;padding-top:18px}.layout{grid-template-columns:250px minmax(0,1fr)}.controls{position:static;padding:18px}.controls>label,.controls #collisionChoice>label{display:block;font-size:13px;font-weight:600;margin-bottom:7px}#collisionChoice{margin-top:20px}summary{cursor:pointer;font-weight:600;font-size:14px;padding:13px 0}#customize{margin-top:14px;border-top:1px solid var(--line)}.direction{margin:12px 0 0}.control{margin:14px 0}.control label{font-weight:500}.tabs{margin-bottom:16px}.scene{height:285px}.stats .stat small{display:none}.stats .stat:last-child{display:none}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat strong{font-size:23px}.extra{border-top:1px solid var(--line)}.extra>.graphs,.extra>.ledger,.extra>.details{margin:0 0 14px}.formula{font:17px/1.8 Georgia,serif}.footer{margin-top:18px}.details p{font-size:13px}.tabs button{padding:10px 14px}
@media(max-width:700px){.layout{grid-template-columns:1fr}.controls{padding:14px}.control-grid{grid-template-columns:1fr 1fr}.shell{padding:14px 12px}.scene{height:258px}.stat strong{font-size:18px}.stat{display:block}.stats .stat strong{text-align:left}.tabs{gap:0}.tabs button{padding:10px;font-size:13px}.top{padding:16px}.top button{font-size:13px}.extra summary{padding:15px 0}.stats{gap:8px}.stat small{display:none}}

<body>
<header class="top"><div class="topline"><div><div class="eyebrow">Physics 12</div><h1>Momentum Lab</h1></div></div></header>
<main class="shell">
<nav class="tabs" role="tablist" aria-label="Experiments">
<button id="tab-collision" role="tab" aria-selected="true" aria-controls="lab" data-mode="collision">Collisions</button>
<button id="tab-impulse" role="tab" aria-selected="false" aria-controls="lab" data-mode="impulse">Impulse</button>
<button id="tab-recoil" role="tab" aria-selected="false" aria-controls="lab" data-mode="recoil">Recoil</button>
<button id="tab-pendulum" role="tab" aria-selected="false" aria-controls="lab" data-mode="pendulum">Catch & rise</button>
</nav>
<div class="layout" id="lab" role="tabpanel" aria-labelledby="tab-collision">
<aside class="controls panel"><label for="preset">Example</label><select id="preset"></select>
<div id="collisionChoice"><label for="collisionType">Collision type</label><select id="collisionType"><option value="1">Elastic · bounce</option><option value="0.5">Inelastic · less bounce</option><option value="0">Perfectly inelastic · stick</option><option value="custom" hidden>Custom bounce</option></select></div>
<details id="customize"><summary>Adjust values</summary><div id="controls" class="control-grid"></div></details>
<p class="subtle direction">Right + &nbsp; Left −</p></aside>
<section class="main" aria-label="Simulation">
<div id="error" class="error" role="alert" hidden></div>
<section class="panel scene-wrap" aria-label="Animated experiment">
<div class="scene-label"><span id="stageLabel"></span><div class="legend" id="sceneLegend"></div></div>
<svg id="scene" class="scene" role="img" aria-label="Experiment animation"></svg>
<div class="transport"><button class="primary" id="play">Play</button><button id="reset">Reset</button><button id="event">At impact</button><label class="sr" for="speed">Playback speed</label><select id="speed" class="speed"><option value="0.25">¼×</option><option value="0.5">½×</option><option value="1" selected>1×</option><option value="2">2×</option></select><span id="clock" class="clock"></span></div>
<div class="scrub"><label for="timeline">Time</label><input id="timeline" type="range" min="0" max="1000" step="1" value="0" aria-valuetext="0 seconds"></div><div class="sr" id="status" aria-live="polite"></div>
</section>
<div class="stats" id="stats"></div>
<details class="extra" id="graphsDetails"><summary>Graphs</summary><div class="graphs" id="graphs"><section class="panel graph"><h3 id="graphTitle1"></h3><div id="legend1" class="legend chartlegend"></div><svg id="plot1" class="plot" role="img"></svg></section><section class="panel graph" id="graph2"><h3 id="graphTitle2"></h3><div id="legend2" class="legend chartlegend"></div><svg id="plot2" class="plot" role="img"></svg></section></div></details>
<details class="extra" id="resultsDetails"><summary>Results</summary><section class="panel ledger"><div class="ledgerhead"><h3>Before & after</h3><button id="reveal" aria-pressed="false">Show answers</button></div><div class="tablewrap"><table><thead><tr><th scope="col">Quantity</th><th scope="col">Before</th><th scope="col">Now</th><th scope="col" id="finalHeading">After</th></tr></thead><tbody id="ledger"></tbody></table></div><p id="ledgerNote" class="subtle"></p><button id="export">Download data</button></section></details>
<details class="extra" id="physicsDetails"><summary>Formulas & model</summary><div class="panel details"><div id="formula" class="formula"></div><p id="controlNote"></p><div id="explanation"></div></div></details>
<div hidden><span id="title"></span><span id="subtitle"></span><span id="system"></span><span id="prompt"></span></div>
</section></div>
<footer class="footer">Ideal models · No friction</footer>
</main>
<script>
'use strict';
(() => {
const $=id=>document.getElementById(id), G=9.81, COLORS=['#087f8c','#c15a21','#42596b'];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const fmt=(v,n=3)=> Math.abs(v)<1e-9?'0.000':Number(v).toFixed(n);
const signed=v=>(v>1e-9?'+':'')+fmt(v);
const E=(m,v)=>0.5*m*v*v;
function collision(s){const {m1,m2,u1,u2,e}=s;if(u1<=u2)return {v1:u1,v2:u2,hit:false};return {v1:(m1*u1+m2*u2-m2*e*(u1-u2))/(m1+m2),v2:(m1*u1+m2*u2+m1*e*(u1-u2))/(m1+m2),hit:true};}
function recoil(s){const reduced=s.m1*s.m2/(s.m1+s.m2),relative=Math.sqrt(2*s.energy/reduced);return {v1:s.drift-s.m2/(s.m1+s.m2)*relative,v2:s.drift+s.m1/(s.m1+s.m2)*relative};}
function pulse(z,shape){z=clamp(z,0,1);if(shape==='triangle')return {c:z<=.5?2*z*z:1-2*(1-z)**2,h:z<=.5?2*z**3/3:z-.5+2*(1-z)**3/3,f:z<=.5?4*z:4*(1-z)};if(shape==='sine')return {c:(1-Math.cos(Math.PI*z))/2,h:z/2-Math.sin(Math.PI*z)/(2*Math.PI),f:Math.PI/2*Math.sin(Math.PI*z)};return {c:z,h:z*z/2,f:1};}
function pendulum(s){const mass=s.m1+s.m2,v=s.m1*s.u/mass,h=v*v/(2*G);if(h>.8*s.length)return {valid:false,mass,v,h};let theta=0,omega=v/s.length,t=0;const samples=[{t,theta,omega}];const dt=.001;for(let i=0;i<20000;i++){const a=-G/s.length*Math.sin(theta),nextTheta=theta+omega*dt+.5*a*dt*dt,nextOmega=omega+.5*(a-G/s.length*Math.sin(nextTheta))*dt;t+=dt;if(nextOmega<=0){const fraction=omega/(omega-nextOmega);t=t-dt+fraction*dt;samples.push({t,theta:Math.acos(1-h/s.length),omega:0});break;}theta=nextTheta;omega=nextOmega;samples.push({t,theta,omega});}return {valid:true,mass,v,h,samples,riseTime:t};}
const modes={
collision:{title:'Where does the momentum go?',subtitle:'Change the masses, velocities, and collision type.',system:'System: cart A + cart B',prompt:'Which cart will move faster afterward? Will total momentum and kinetic energy both stay the same?',defaults:{m1:2,m2:2,u1:3,u2:0,e:1},controls:[['m1','Mass A',.2,10,.1,'kg'],['m2','Mass B',.2,10,.1,'kg'],['u1','Initial velocity A',-6,6,.1,'m/s'],['u2','Initial velocity B',-6,6,.1,'m/s']],presets:[['Equal masses',{m1:2,m2:2,u1:3,u2:0,e:1}],['Head-on · unequal masses',{m1:2,m2:4,u1:3,u2:-1,e:1}],['Separate, but lose kinetic energy',{m1:2,m2:2,u1:3,u2:0,e:.5}],['Catch & stick',{m1:2,m2:3,u1:4,u2:0,e:0}],['Zero total momentum',{m1:2,m2:2,u1:3,u2:-3,e:0}]],formula:'p = mv<br>Σp<sub>before</sub> = Σp<sub>after</sub><br>K = ½mv²',note:'e = 1: elastic · 0 < e < 1: inelastic · e = 0: perfectly inelastic (stick). Positive velocity points right.',explain:'<p><b>Choose the system:</b> both carts. Horizontal external impulse is zero. Individual cart momentum can change while the total stays fixed.</p><p><b>Collision types:</b> elastic conserves total kinetic energy; inelastic loses some kinetic energy; perfectly inelastic carts share one velocity. Separation alone does not prove a collision is elastic. Total energy is conserved when internal energy, sound, and deformation are included.</p><p><b>Model:</b> one-dimensional point-mass translation with a coefficient of restitution e = (vB − vA)/(uA − uB). Solve this relationship with momentum conservation. Contact is instantaneous; the e = 0 model latches the carts. Cart widths are illustrative; positions use an arbitrary origin.</p><p><b>Newton’s third law:</b> interaction forces are equal and opposite at every instant in a real collision, over the same time interval. Thus JA = −JB. Unequal masses have unequal accelerations—not unequal interaction forces.</p><p><b>No encounter:</b> with A starting left of B, a collision needs uA > uB. Otherwise they keep their original velocities. The restitution setting has no effect without a collision.</p>'},
impulse:{title:'Same momentum change. Different force.',subtitle:'Stretch the stopping time and inspect the area under the force curve.',system:'System: object A; external force',prompt:'Keep the velocities fixed and double the duration. What happens to impulse, average force, and stopping distance?',defaults:{mass:2,u:4,v:0,duration:1},controls:[['mass','Object mass',.2,10,.1,'kg'],['u','Initial velocity',-8,8,.1,'m/s'],['v','Final velocity',-8,8,.1,'m/s'],['duration','Force duration',.1,3,.1,'s']],presets:[['Cushioned stop',{mass:2,u:4,v:0,duration:1}],['Hard stop · same impulse',{mass:2,u:4,v:0,duration:.2}],['Bounce back',{mass:.5,u:6,v:-4,duration:.4}],['Constant-force slowdown',{mass:2,u:5,v:1,duration:2}]],formula:'J = Δp = m(v − u)<br>F<sub>avg</sub> = J / Δt<br>J = signed area under F(t)',note:'The pulse is a prescribed net external force. Its area is set by the requested velocity change. The fixed triangular pulse shows how impulse depends on force and time.',explain:'<p><b>Impulse:</b> the signed area under a force–time graph equals the change in momentum. Negative force and impulse point left; they are not negative amounts of time.</p><p><b>Cushioning:</b> for the same mass and initial/final velocities, longer interaction time means smaller average force. The impulse does not shrink. Peak and average force are not generally equal.</p><p><b>Model:</b> the chosen pulse is the net force on a constant-mass object. The pulse is triangular and its area equals the change in momentum.</p><p><b>Motion:</b> velocity comes from accumulated impulse; position is its time integral. For a constant force, displacement = ½(u + v)Δt. With reversal, displacement is not total distance travelled. A zero final velocity means the final displacement is the stopping distance only if motion never reversed.</p><p><b>System boundary:</b> the force provider is outside this one-object system, so the object’s momentum is not conserved. A larger system including the provider could conserve total momentum.</p>'},
recoil:{title:'A push apart. One conserved total.',subtitle:'Release internal energy and compare equal impulses with unequal speeds.',system:'System: A + B + release mechanism',prompt:'Which object gains more momentum? Which moves faster relative to their original motion?',defaults:{m1:2,m2:5,energy:12,drift:0},controls:[['m1','Mass A',.2,10,.1,'kg'],['m2','Mass B',.2,10,.1,'kg'],['energy','Released internal energy',0,80,1,'J'],['drift','Initial shared velocity',-3,3,.1,'m/s']],presets:[['Unequal masses · initially at rest',{m1:2,m2:5,energy:12,drift:0}],['Equal masses',{m1:3,m2:3,energy:18,drift:0}],['Moving together before release',{m1:2,m2:5,energy:8,drift:2}]],formula:'Σp<sub>before</sub> = Σp<sub>after</sub><br>Δp<sub>A</sub> = −Δp<sub>B</sub><br>K<sub>after</sub> − K<sub>before</sub> = E<sub>released</sub>',note:'The release mechanism is massless and part of the system. All selected internal energy becomes translational kinetic energy.',explain:'<p><b>Push-off / recoil:</b> internal forces cannot change total momentum. From rest, the two final momenta are equal and opposite. The lighter object has the larger speed.</p><p><b>Starting in motion:</b> opposite momentum changes do not necessarily mean opposite final velocity directions. A sufficiently large shared drift can leave both objects moving right.</p><p><b>Energy:</b> kinetic energy increases because stored internal energy is released. Momentum conservation does not require kinetic-energy conservation.</p><p><b>Model:</b> instantaneous internal release with no external horizontal force. Relative separation speed is √(2E/μ), where μ = mA mB/(mA + mB). Momentum conservation fixes each final velocity. All motion is measured in the same lab frame.</p>'},
pendulum:{title:'One event. Two conservation principles.',subtitle:'Catch a projectile, then watch the joined mass rise.',system:'Collision → swing: boundary matters',prompt:'When is momentum conserved? When is mechanical energy conserved? Can you use one conservation equation across both stages?',defaults:{m1:.1,m2:2,u:12,length:1},controls:[['m1','Projectile mass',.02,1,.02,'kg'],['m2','Catcher mass',.5,10,.1,'kg'],['u','Projectile speed',1,20,.5,'m/s'],['length','Pendulum length',.5,3,.1,'m']],presets:[['Light projectile',{m1:.1,m2:2,u:12,length:1}],['Larger rise',{m1:.4,m2:2,u:12,length:1.5}],['Heavy catcher',{m1:.1,m2:5,u:12,length:1}]],formula:'Catch: mu = (m + M)v<br>Rise: ½(m + M)v² = (m + M)gh<br>g = 9.81 m/s²',note:'The brief catch is perfectly inelastic. The later swing is frictionless. Height is vertical rise above the lowest point—not distance along the arc.',explain:'<p><b>Stage 1 — catch:</b> horizontal external impulse is negligible during the brief collision at the lowest point. Horizontal momentum is conserved. Kinetic energy decreases as the projectile sticks.</p><p><b>Stage 2 — rise:</b> kinetic energy becomes gravitational potential energy. Tension does no work; gravity is conservative. Mechanical energy of the pendulum–Earth system is conserved. Momentum of the joined mass alone is not conserved during the swing: gravity and the support provide external forces.</p><p><b>Model:</b> the joined masses are a point mass on a massless rigid-length suspension; rotation of a real catcher is ignored. Motion ends at the first maximum height. g is constant. The swing uses a small-step velocity-Verlet integration of θ″ = −(g/L) sin θ, with its exact energy-based turning height.</p><p><b>Range:</b> the model accepts h ≤ 0.8L so the suspension stays taut throughout this first swing. If a setup is outside this range, reduce launch speed or projectile mass, increase catcher mass, or increase length.</p>'}
};
let mode='collision',s={...modes.collision.defaults},time=0,running=false,revealed=false,last=0,model=null;
const cacheStates={};
function controlHTML(c){const [id,label,min,max,step,unit]=c;return '<div class="control"><div class="control-head"><label for="n-'+id+'">'+label+'</label><span class="entry"><input id="n-'+id+'" type="number" min="'+min+'" max="'+max+'" step="'+step+'" value="'+s[id]+'"><span class="unit">'+unit+'</span></span></div><input id="r-'+id+'" type="range" aria-label="'+label+' slider" min="'+min+'" max="'+max+'" step="'+step+'" value="'+s[id]+'"></div>';}

function frame(now){if(running){time=Math.min(model.total,time+Math.min((now-last)/1000,.1)*model.total/5*Number($('speed').value));if(time>=model.total){running=false;revealed=true;announce('Experiment complete. Compare the final values with your prediction.');}draw();}last=now;requestAnimationFrame(frame);}
new ResizeObserver(()=>{if(model)draw();}).observe($('lab'));
window.MomentumLab={collision,recoil,pulse,pendulum,sample,getState:()=>({mode,settings:{...s},time,running,revealed,total:model.total,valid:model.valid}),setScenario:(name,values)=>setup(name,values),seek:t=>{running=false;time=clamp(t,0,model.total);draw();}};
$('collisionType').addEventListener('change',e=>{if(e.target.value!=='custom'){s.e=Number(e.target.value);$('n-e').value=s.e;$('r-e').value=s.e;changed();}});
['graphsDetails','resultsDetails'].forEach(id=>$(id).addEventListener('toggle',()=>{if($(id).open)draw();}));
setup('collision');requestAnimationFrame(frame);
})();
</script>
</body>
