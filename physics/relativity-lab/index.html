<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6f4">
  <meta name="description" content="Explore special and general relativity with interactive Physics 12 demonstrations.">
  <title>Relativity Lab · Physics Simulations</title>
  <style>
    :root{color-scheme:light;--ink:#152c3c;--muted:#536978;--paper:#fff;--wash:#f4f6f4;--line:#d8e1e3;--navy:#153b4b;--teal:#087f8c;--orange:#c15a21;--soft:#e9f4f2;--purple:#6558a5}
    *{box-sizing:border-box}body{margin:0;background:var(--wash);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button,a,input[type=range],select{touch-action:manipulation}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #cf702c;outline-offset:3px}a{color:inherit}.top{background:var(--navy);color:#fff;padding:18px max(20px,calc((100vw - 1200px)/2))}.topline{display:flex;align-items:center;gap:15px}.back{color:#d5e2e6;text-decoration:none;font-size:14px}.back:hover{text-decoration:underline}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:2px;font-weight:700;color:#bdd4db;margin:0}h1{font-size:25px;line-height:1.2;margin:2px 0}.shell{max-width:1150px;margin:auto;padding:20px 24px 42px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}.tabs button{cursor:pointer;border:1px solid transparent;border-radius:9px;background:transparent;color:var(--ink);padding:10px 14px;font-weight:600}.tabs button:hover{background:#e8eeed}.tabs button[aria-selected=true]{background:#fff;border-color:var(--line);box-shadow:0 2px 4px #153b4b08}.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}.panel{background:var(--paper);border:1px solid var(--line);border-radius:13px}.controls{padding:18px}.control{margin:18px 0 21px}.control-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:6px}.control label{font-size:13px;font-weight:600}.value{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--teal);font-weight:650}.control input[type=range]{display:block;width:100%;accent-color:var(--teal);cursor:pointer}.hint{color:var(--muted);font-size:12px;margin:12px 0 0}.main{min-width:0}.scene{padding:16px 18px 9px}.scene-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:8px}.scene-head h2{font-size:16px;margin:0;font-weight:650}.scene-head span{font-size:12px;color:var(--muted)}svg{display:block;width:100%;height:auto;max-height:380px}.svg-label{font:13px system-ui,sans-serif;fill:var(--muted)}.svg-title{font:600 14px system-ui,sans-serif;fill:var(--ink)}.results{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:12px 0}.result{padding:12px 14px;min-width:0}.result span{display:block;color:var(--muted);font-size:12px}.result strong{display:block;font-size:18px;line-height:1.3;font-weight:650;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.explain{padding:14px 16px;color:var(--muted);font-size:13px}.explain strong{color:var(--ink);font-weight:650}.choice{display:flex;gap:8px;margin-top:16px}.choice button{flex:1;cursor:pointer;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);padding:9px}.choice button[aria-pressed=true]{background:var(--soft);border-color:#a9d1d0;color:#155c62}.hidden{display:none!important}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:740px){.shell{padding:14px 12px 30px}.layout{grid-template-columns:1fr}.controls{padding:14px}.controls-inner{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px}.control{margin:12px 0}.scene{padding:13px}.results{gap:7px}.result{padding:10px}.result strong{font-size:16px}.tabs{gap:2px}.tabs button{padding:9px 10px;font-size:13px}}
    @media(max-width:420px){.controls-inner{grid-template-columns:1fr}.results{grid-template-columns:1fr 1fr}.result:last-child:nth-child(odd){grid-column:1/-1}.scene-head{align-items:flex-start;flex-direction:column;gap:2px}.top{padding:15px}}
  </style>
</head>
<body>
  <header class="top"><div class="topline"><a class="back" href="../../" aria-label="Back to Ganeev Mujral’s website">← Website</a><div><p class="eyebrow">Physics 12</p><h1>Relativity Lab</h1></div></div></header>
  <main class="shell">
    <nav class="tabs" role="tablist" aria-label="Relativity topics">
      <button type="button" role="tab" id="tab-spacetime" aria-selected="true" aria-controls="lab" data-mode="spacetime">Spacetime</button>
      <button type="button" role="tab" id="tab-momenergy" aria-selected="false" aria-controls="lab" data-mode="momenergy">Momenergy</button>
      <button type="button" role="tab" id="tab-velocity" aria-selected="false" aria-controls="lab" data-mode="velocity">Velocity</button>
      <button type="button" role="tab" id="tab-gravity" aria-selected="false" aria-controls="lab" data-mode="gravity">Gravity &amp; light</button>
    </nav>
    <div class="layout" id="lab" role="tabpanel" aria-labelledby="tab-spacetime">
      <aside class="panel controls" id="controls" aria-label="Simulation controls"></aside>
      <section class="main" aria-label="Relativity simulation">
        <section class="panel scene" aria-live="polite">
          <div class="scene-head"><h2 id="sceneTitle"></h2><span id="sceneHint"></span></div>
          <div id="visual"></div>
        </section>
        <div class="results" id="results" aria-live="polite"></div>
        <section class="panel explain" id="explanation" hidden></section>
      </section>
    </div>
  </main>
  <script>
  (()=>{
    const $=id=>document.getElementById(id), c=299792458, G=6.67430e-11, solarMass=1.989e30;
    let mode='spacetime', direction=1;const saved={};
    const tabs=[...document.querySelectorAll('[data-mode]')];
    const definitions={
      spacetime:{title:'One light clock, two reference frames',hint:'Same light speed · different path lengths',controls:[['beta','Spaceship speed',0,.95,.01,.8,'c']],note:'Adjust the speed as a fraction of light speed.',explain:'Einstein’s postulates: the laws of physics are the same in every inertial frame, and every inertial observer measures light in vacuum at speed c. <strong>Proper time</strong> is measured where both clock events happen at the same place (the ship); Earth measures a longer interval. <strong>Proper length</strong> is measured in the object’s rest frame; moving observers measure contraction only along the direction of motion. Events simultaneous in one frame may not be simultaneous in another.',render(v){const b=v.beta,g=1/Math.sqrt(1-b*b),dx=60*b*g,y1=80,y2=172,w=76/g;const xA=180,xB=585,xStart=xB-40,xEnd=xStart+dx;return {controls:[['beta','Spaceship speed',b.toFixed(2)+'c']],results:[['Lorentz factor γ',g.toFixed(2)],['1.00 s on ship',`${g.toFixed(2)} s on Earth`],['100 m ship',`${(100/g).toFixed(1)} m from Earth`]],svg:`<svg viewBox="0 0 760 250" role="img" aria-labelledby="s-title s-desc"><title id="s-title">Light clock in two frames</title><desc id="s-desc">In the ship frame, light goes straight up between mirrors. In the Earth frame, the moving clock’s light follows a longer diagonal path.</desc><rect x="18" y="24" width="333" height="205" rx="10" fill="var(--soft)"/><rect x="391" y="24" width="351" height="205" rx="10" fill="var(--soft)"/><text class="svg-title" x="34" y="49">Ship frame · clock at rest</text><text class="svg-title" x="407" y="49">Earth frame · ship moves →</text><rect x="${xA-38}" y="68" width="76" height="128" rx="8" fill="#087f8c" fill-opacity=".08" stroke="var(--teal)"/><line x1="${xA-25}" y1="${y1}" x2="${xA+25}" y2="${y1}" stroke="var(--ink)" stroke-width="4"/><line x1="${xA-25}" y1="${y2}" x2="${xA+25}" y2="${y2}" stroke="var(--ink)" stroke-width="4"/><path d="M${xA} ${y2-7} L${xA} ${y1+7}" stroke="var(--orange)" stroke-width="3" fill="none"/><circle cx="${xA}" cy="${y2-7}" r="5" fill="var(--orange)"/><rect x="${xEnd-w/2}" y="68" width="${w}" height="128" rx="8" fill="#087f8c" fill-opacity=".08" stroke="var(--teal)"/><rect x="${xStart-w/2}" y="68" width="${w}" height="128" rx="8" fill="none" stroke="var(--muted)" stroke-dasharray="5 5" opacity=".55"/><line x1="${xEnd-25}" y1="${y1}" x2="${xEnd+25}" y2="${y1}" stroke="var(--ink)" stroke-width="4"/><line x1="${xStart-25}" y1="${y1}" x2="${xStart+25}" y2="${y1}" stroke="var(--ink)" stroke-width="3" opacity=".45"/><path d="M${xStart} ${y2-7} L${xEnd} ${y1+7}" stroke="var(--orange)" stroke-width="3" fill="none"/><circle cx="${xStart}" cy="${y2-7}" r="5" fill="var(--orange)"/><text class="svg-label" x="34" y="218">proper ship length</text><text class="svg-label" x="407" y="218">contracted ship · diagonal light path</text></svg>`};}},
      momenergy:{title:'Momentum and energy grow near c',hint:'Watch the relativistic values rise with speed',controls:[['beta','Object speed',0,.99,.01,.8,'c'],['mass','Rest mass',.1,10,.1,1,'kg']],note:'The object’s mass is its rest mass.',explain:'Relativistic momentum is <strong>p = γmv</strong> and is conserved when net external force is zero. Kinetic energy is <strong>K = (γ − 1)mc²</strong>, rest energy is <strong>E₀ = mc²</strong>, and total energy is <strong>E = γmc²</strong>. As speed approaches c, γ rises sharply; an object with nonzero rest mass cannot reach c.',render(v){const b=v.beta,m=v.mass,g=1/Math.sqrt(1-b*b),p=g*m*b*c,K=(g-1)*m*c*c,E=g*m*c*c,E0=m*c*c;return {controls:[['beta','Object speed',b.toFixed(2)+'c'],['mass','Rest mass',m.toFixed(1)+' kg']],results:[['Lorentz factor γ',g.toFixed(2)],['Momentum p',sci(p)+' kg·m/s'],['Kinetic energy K',sci(K)+' J'],['Rest energy E₀',sci(E0)+' J'],['Total energy E',sci(E)+' J']],svg:`<svg viewBox="0 0 760 250" role="img" aria-labelledby="m-title m-desc"><title id="m-title">Relativistic energy and momentum versus speed</title><desc id="m-desc">The energy and momentum indicator rises slowly at low speed and steeply as speed approaches the speed of light. Current Lorentz factor is ${g.toFixed(2)}.</desc><text class="svg-label" x="48" y="222">0</text><text class="svg-label" x="674" y="222">speed → c</text><line x1="60" y1="198" x2="700" y2="198" stroke="var(--line)" stroke-width="2"/><path d="M60 191 C330 188 500 175 570 145 C635 115 665 62 700 27" fill="none" stroke="var(--teal)" stroke-width="4"/><line x1="${60+b/.99*640}" y1="34" x2="${60+b/.99*640}" y2="198" stroke="var(--orange)" stroke-dasharray="5 5" stroke-width="2"/><circle cx="${60+b/.99*640}" cy="${198-(g-1)/6*160}" r="7" fill="var(--orange)"/><text class="svg-title" x="60" y="28">γ = ${g.toFixed(2)} at ${b.toFixed(2)}c</text><text class="svg-label" x="60" y="244">At low speeds, relativistic results approach classical physics.</text></svg>`};}},
      velocity:{title:'Two velocities, one speed limit',hint:'One-dimensional motion',controls:[['v','Frame speed',0,.95,.01,.6,'c'],['u','Object speed in moving frame',0,.95,.01,.7,'c']],note:'Choose whether the object moves with or against the frame.',explain:'Use <strong>u = (v + u′) / (1 + vu′/c²)</strong>, assigning a negative sign when the object is launched opposite the frame’s motion. Unlike ordinary addition, relativistic velocity addition never gives a result greater than c.',render(v){const b=v.v,up=v.u*direction,u=(b+up)/(1+b*up),percent=Math.max(0,Math.min(1,Math.abs(u)));return {controls:[['v','Frame speed',b.toFixed(2)+'c'],['u','Object speed',Math.abs(up).toFixed(2)+'c']],results:[['Frame speed v',b.toFixed(2)+'c'],['Object speed u′',(up<0?'−':'')+Math.abs(up).toFixed(2)+'c'],['Measured speed u',(u<0?'−':'')+Math.abs(u).toFixed(3)+'c']],svg:`<svg viewBox="0 0 760 250" role="img" aria-labelledby="v-title v-desc"><title id="v-title">Relativistic velocity addition</title><desc id="v-desc">The resulting velocity is ${u.toFixed(3)} times the speed of light, below the speed-of-light limit.</desc><text class="svg-title" x="45" y="44">Measured object speed</text><line x1="65" y1="116" x2="695" y2="116" stroke="var(--line)" stroke-width="15" stroke-linecap="round"/><line x1="65" y1="116" x2="${65+630*percent}" y2="116" stroke="var(--teal)" stroke-width="15" stroke-linecap="round"/><line x1="695" y1="75" x2="695" y2="158" stroke="var(--orange)" stroke-width="3"/><circle cx="${65+630*percent}" cy="116" r="15" fill="var(--orange)"/><text class="svg-label" x="60" y="166">0</text><text class="svg-label" x="670" y="185">c</text><text class="svg-title" x="${Math.min(615,Math.max(70,65+630*percent))}" y="82">${Math.abs(u).toFixed(3)}c</text><text class="svg-label" x="65" y="220">Measured speed stays below the light-speed limit</text></svg>`};}},
      gravity:{title:'Gravity changes the path and the light',hint:'General relativity · concept view',controls:[['mass','Central mass',1,10,.1,5,'× Sun'],['radius','Emitter distance',1.1,10,.1,3,'× Schwarzschild radius']],note:'Diagram is illustrative, not to scale.',explain:'In general relativity, mass curves spacetime and light follows a curved path near a massive object. Light climbing away from gravity is gravitationally redshifted: its wavelength gets longer and its frequency decreases. The event horizon is where escape speed reaches c. The equivalence principle says a uniform gravitational field and an equivalent acceleration cannot be distinguished by a local experiment. Motion of a light source also causes Doppler redshift (moving away) or blueshift (moving toward).',render(v){const m=v.mass,r=v.radius,rs=2*G*m*solarMass/(c*c),z=1/Math.sqrt(1-1/r)-1,lam=500*(1+z),bend=28+Math.min(58,90/r);return {controls:[['mass','Central mass',m.toFixed(1)+' × Sun'],['radius','Emitter distance',r.toFixed(1)+' × Rₛ']],results:[['Schwarzschild radius Rₛ',formatDistance(rs)],['Wavelength shift',`${lam.toFixed(0)} nm from 500 nm`],['At event horizon',`r = Rₛ · escape speed = c`]],svg:`<svg viewBox="0 0 760 250" role="img" aria-labelledby="g-title g-desc"><title id="g-title">Light bending near a massive object</title><desc id="g-desc">A light ray bends around a massive object and emerges with a longer wavelength. The event horizon is marked around the object.</desc><path d="M42 74 C215 74 278 ${74+bend} 380 ${166-bend} C480 ${74+bend} 550 74 710 74" fill="none" stroke="var(--orange)" stroke-width="4"/><path d="M42 134 C225 134 275 134 350 134" fill="none" stroke="var(--purple)" stroke-width="3" stroke-dasharray="7 7"/><circle cx="380" cy="134" r="46" fill="#153b4b"/><circle cx="380" cy="134" r="64" fill="none" stroke="var(--orange)" stroke-width="2" stroke-dasharray="6 5"/><text x="351" y="139" fill="#fff" font-size="12" font-family="system-ui">mass</text><text class="svg-label" x="42" y="53">light emitted</text><text class="svg-label" x="615" y="53">redshifted light</text><text class="svg-label" x="325" y="220">event horizon · r = Rₛ</text></svg>`};}}
    };
    function sci(n){if(n===0)return '0';return n.toExponential(2).replace('e+',' × 10^').replace('e-',' × 10^−')}
    function formatDistance(n){if(n>=1e9)return (n/1e9).toFixed(2)+' billion m';if(n>=1e6)return (n/1e6).toFixed(2)+' million m';if(n>=1000)return (n/1000).toFixed(2)+' km';return n.toFixed(0)+' m'}
    function currentValues(){return Object.fromEntries([...$('controls').querySelectorAll('input[type=range]')].map(el=>[el.id,Number(el.value)]))}
    function controlsHTML(def,values){const sliders=def.controls.map(([id,label,min,max,step,initial,unit])=>`<div class="control"><div class="control-head"><label for="${id}">${label}</label><span class="value" id="${id}-value"></span></div><input id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${values[id]??initial}" data-unit="${unit}" aria-describedby="control-hint"></div>`).join('');return `<div class="controls-inner">${sliders}</div><p class="hint" id="control-hint">${def.note}</p>${mode==='velocity'?'<div class="choice" aria-label="Launch direction"><button type="button" data-direction="1" aria-pressed="true">Same direction</button><button type="button" data-direction="-1" aria-pressed="false">Opposite</button></div>':''}`}
    function setup(next){if($('controls').querySelector('input[type=range]'))saved[mode]=currentValues();mode=next;direction=1;tabs.forEach(t=>t.setAttribute('aria-selected',String(t.dataset.mode===mode)));$('lab').setAttribute('aria-labelledby','tab-'+mode);const def=definitions[mode];$('controls').innerHTML=controlsHTML(def,saved[mode]||{});$('sceneTitle').textContent=def.title;$('sceneHint').textContent=def.hint;$('explanation').innerHTML=def.explain;$('controls').querySelectorAll('input[type=range]').forEach(input=>input.addEventListener('input',render));$('controls').querySelectorAll('[data-direction]').forEach(button=>button.addEventListener('click',()=>{direction=Number(button.dataset.direction);$('controls').querySelectorAll('[data-direction]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));render()}));render()}
    function render(){const def=definitions[mode],values=currentValues(),output=def.render(values);for(const [id,text] of output.controls){const label=$(id+'-value');if(label)label.textContent=text} $('results').innerHTML=output.results.map(([label,value])=>`<div class="panel result"><span>${label}</span><strong>${value}</strong></div>`).join('');$('visual').innerHTML=output.svg}
    tabs.forEach(tab=>tab.addEventListener('click',()=>setup(tab.dataset.mode)));
    document.querySelector('.tabs').addEventListener('keydown',event=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();const current=tabs.indexOf(document.activeElement),next=event.key==='Home'?0:event.key==='End'?tabs.length-1:(current+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;tabs[next].focus();setup(tabs[next].dataset.mode)});
    setup('spacetime');
  })();
  </script>
</body>
</html>
